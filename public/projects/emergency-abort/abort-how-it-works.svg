<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .t{font-size:26px;font-weight:700;fill:#111827}
    .st{font-size:14px;fill:#4b5563}
    .panel{fill:#fff;stroke:#d1d5db;stroke-width:1.5}
    .ph{font-size:15px;font-weight:700;fill:#111827}
    .ps{font-size:12.5px;fill:#4b5563}
    .nm{font-size:13px;font-weight:600;text-anchor:middle}
    .kd{font-size:10.5px;text-anchor:middle;fill:#6b7280}
    .li{font-size:12px;font-weight:600}
    .edge{stroke:#9ca3af;stroke-width:1.5;fill:none}
    .edgeA{stroke:#dc2626;stroke-width:2;fill:none}
    .run rect{fill:#dbeafe;stroke:#2563eb;stroke-width:1.6}.run text{fill:#1e3a8a}
    .ok rect{fill:#dcfce7;stroke:#16a34a;stroke-width:1.6}.ok text{fill:#14532d}
    .bad rect{fill:#fee2e2;stroke:#dc2626;stroke-width:1.6}.bad text{fill:#7f1d1d}
    .abort rect{fill:#fee2e2;stroke:#dc2626;stroke-width:2.2}.abort text{fill:#7f1d1d}
    .idle rect{fill:#fff;stroke:#d1d5db;stroke-width:1.2}.idle text{fill:#9ca3af}
    .halt rect{fill:#f3f4f6;stroke:#9ca3af;stroke-width:1.2;stroke-dasharray:4 3}.halt text{fill:#9ca3af;text-decoration:line-through}
    .note{font-size:12.5px;fill:#374151}
    .step{fill:#fff;stroke-width:1.6}
    .sv{stroke:#16a34a}.sp{stroke:#d97706;stroke-dasharray:6 4}
    .sh{font-size:14px;font-weight:700;fill:#111827}
    .c{font-family:Consolas,Menlo,'DejaVu Sans Mono',monospace;font-size:11px;fill:#1f2937;white-space:pre}
    .sn{font-size:12px;fill:#4b5563}
    .tag{font-size:11px;font-weight:700}
    .ar{stroke:#374151;stroke-width:1.6;fill:none}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#374151"/></marker>
  </defs>

  <rect width="1200" height="840" fill="#f6f7f9"/>
  <text class="t" x="24" y="44">Emergency abort: how one ABORT message takes over the tree</text>
  <text class="st" x="24" y="68">WARG airside engine · py_trees behaviour tree · ROS 2 and MAVROS · node states shown for one tick before and one tick after ABORT</text>

  <!-- ================= BEFORE ================= -->
  <rect class="panel" x="20" y="88" width="570" height="410" rx="8"/>
  <text class="ph" x="38" y="114">Before ABORT</text>
  <text class="ps" x="38" y="134">CheckAbort fails, so the Selector falls through to the mission</text>

  <path class="edge" d="M305 186V198H140V214M305 198H445V214"/>
  <path class="edge" d="M140 252V262H75V276M140 262H175V276M140 262H280V276M175 312V330"/>
  <path class="edge" d="M375 252V472M375 300H390M375 328H390M375 356H390M375 384H390M375 412H390M375 440H390M375 468H390"/>

  <g class="run"><rect x="205" y="148" width="200" height="38" rx="5"/><text class="nm" x="305" y="166">SafetySupervisor</text><text class="kd" x="305" y="180">Selector · memory=False</text></g>
  <g class="bad"><rect x="85" y="214" width="110" height="38" rx="5"/><text class="nm" x="140" y="232">Abort</text><text class="kd" x="140" y="246">Sequence · FAILURE</text></g>
  <g class="run"><rect x="375" y="214" width="140" height="38" rx="5"/><text class="nm" x="445" y="232">KillSwitch → Mission</text><text class="kd" x="445" y="246">Sequence · RUNNING</text></g>
  <g class="bad"><rect x="32" y="276" width="86" height="36" rx="5"/><text class="nm" x="75" y="293">CheckAbort</text><text class="kd" x="75" y="306">FAILURE</text></g>
  <g class="idle"><rect x="128" y="276" width="94" height="36" rx="5"/><text class="nm" x="175" y="293">RetryLand</text><text class="kd" x="175" y="306">not ticked</text></g>
  <g class="idle"><rect x="232" y="276" width="96" height="36" rx="5"/><text class="nm" x="280" y="293">Aborted</text><text class="kd" x="280" y="306">not ticked</text></g>
  <g class="idle"><rect x="128" y="330" width="94" height="36" rx="5"/><text class="nm" x="175" y="347">AbortLand</text><text class="kd" x="175" y="360">not ticked</text></g>

  <g class="ok"><rect x="390" y="288" width="180" height="24" rx="4"/><text class="li" x="400" y="305">✓ ConfigureStreamRates</text></g>
  <g class="ok"><rect x="390" y="316" width="180" height="24" rx="4"/><text class="li" x="400" y="333">✓ LoadWaypointList</text></g>
  <g class="ok"><rect x="390" y="344" width="180" height="24" rx="4"/><text class="li" x="400" y="361">✓ Takeoff</text></g>
  <g class="run"><rect x="390" y="372" width="180" height="24" rx="4"/><text class="li" x="400" y="389">▶ Lapping (running)</text></g>
  <g class="idle"><rect x="390" y="400" width="180" height="24" rx="4"/><text class="li" x="400" y="417">TargetReconnaissance</text></g>
  <g class="idle"><rect x="390" y="428" width="180" height="24" rx="4"/><text class="li" x="400" y="445">LandPhase</text></g>
  <g class="idle"><rect x="390" y="456" width="180" height="24" rx="4"/><text class="li" x="400" y="473">MissionComplete</text></g>

  <text class="note" x="38" y="400">The Selector ticks its children in order on</text>
  <text class="note" x="38" y="418">every cycle, and Abort comes first. With no</text>
  <text class="note" x="38" y="436">message on /commander/abort, CheckAbort</text>
  <text class="note" x="38" y="454">returns FAILURE, Abort fails, and the</text>
  <text class="note" x="38" y="472">Selector moves on to run the mission.</text>

  <!-- ================= AFTER ================= -->
  <rect class="panel" x="610" y="88" width="570" height="410" rx="8"/>
  <text class="ph" x="628" y="114">After ABORT (the next tick)</text>
  <text class="ps" x="628" y="134">CheckAbort succeeds, so the Abort branch takes over and the mission is halted</text>

  <path class="edgeA" d="M895 186V198H730V214"/><path class="edge" d="M895 198H1035V214"/>
  <path class="edgeA" d="M730 252V262H665V276M730 262H765V276M765 312V330"/><path class="edge" d="M730 262H870V276"/>
  <path class="edge" d="M965 252V472M965 300H980M965 328H980M965 356H980M965 384H980M965 412H980M965 440H980M965 468H980"/>

  <g class="run"><rect x="795" y="148" width="200" height="38" rx="5"/><text class="nm" x="895" y="166">SafetySupervisor</text><text class="kd" x="895" y="180">Selector · memory=False</text></g>
  <g class="abort"><rect x="675" y="214" width="110" height="38" rx="5"/><text class="nm" x="730" y="232">Abort</text><text class="kd" x="730" y="246">Sequence · RUNNING</text></g>
  <g class="halt"><rect x="965" y="214" width="140" height="38" rx="5"/><text class="nm" x="1035" y="232">KillSwitch → Mission</text><text class="kd" x="1035" y="246">halted</text></g>
  <g class="ok"><rect x="622" y="276" width="86" height="36" rx="5"/><text class="nm" x="665" y="293">CheckAbort</text><text class="kd" x="665" y="306">SUCCESS</text></g>
  <g class="abort"><rect x="718" y="276" width="94" height="36" rx="5"/><text class="nm" x="765" y="293">RetryLand</text><text class="kd" x="765" y="306">retry forever</text></g>
  <g class="idle"><rect x="822" y="276" width="96" height="36" rx="5"/><text class="nm" x="870" y="293">Aborted</text><text class="kd" x="870" y="306">after landing</text></g>
  <g class="abort"><rect x="718" y="330" width="94" height="36" rx="5"/><text class="nm" x="765" y="347">AbortLand</text><text class="kd" x="765" y="360">RUNNING</text></g>

  <g class="halt"><rect x="980" y="288" width="180" height="24" rx="4"/><text class="li" x="990" y="305">ConfigureStreamRates</text></g>
  <g class="halt"><rect x="980" y="316" width="180" height="24" rx="4"/><text class="li" x="990" y="333">LoadWaypointList</text></g>
  <g class="halt"><rect x="980" y="344" width="180" height="24" rx="4"/><text class="li" x="990" y="361">Takeoff</text></g>
  <g class="halt"><rect x="980" y="372" width="180" height="24" rx="4"/><text class="li" x="990" y="389">Lapping</text></g>
  <g class="halt"><rect x="980" y="400" width="180" height="24" rx="4"/><text class="li" x="990" y="417">TargetReconnaissance</text></g>
  <g class="halt"><rect x="980" y="428" width="180" height="24" rx="4"/><text class="li" x="990" y="445">LandPhase</text></g>
  <g class="halt"><rect x="980" y="456" width="180" height="24" rx="4"/><text class="li" x="990" y="473">MissionComplete</text></g>

  <text class="note" x="628" y="400">Because memory=False, the Selector re-checks</text>
  <text class="note" x="628" y="418">Abort first on every tick. Once Abort stops</text>
  <text class="note" x="628" y="436">failing, the Selector halts the mission branch</text>
  <text class="note" x="628" y="454">mid-step. Aborted returns RUNNING forever, so</text>
  <text class="note" x="628" y="472">the mission can never resume.</text>

  <!-- ================= MESSAGE FLOW ================= -->
  <text class="ph" x="24" y="534">Message flow, from the operator to the flight controller</text>

  <g>
    <rect class="step sv" x="20" y="550" width="214" height="200" rx="6"/>
    <text class="tag" x="34" y="572" fill="#15803d">1 · VERIFIED</text>
    <text class="sh" x="34" y="594">Operator sends ABORT</text>
    <text class="c" x="34" y="618">ros2 topic pub</text>
    <text class="c" x="34" y="634">  /commander/abort</text>
    <text class="c" x="34" y="650">  std_msgs/msg/Empty</text>
    <text class="sn" x="34" y="676">Same ground command stream</text>
    <text class="sn" x="34" y="692">used for mission coordinates.</text>
    <text class="sn" x="34" y="708">The message has no fields;</text>
    <text class="sn" x="34" y="724">arriving is the signal.</text>
  </g>
  <g>
    <rect class="step sv" x="256" y="550" width="214" height="200" rx="6"/>
    <text class="tag" x="270" y="572" fill="#15803d">2 · VERIFIED</text>
    <text class="sh" x="270" y="594">CheckAbort latches</text>
    <text class="c" x="270" y="618">_abort_callback(msg)</text>
    <text class="c" x="270" y="634">  _abort_received = True</text>
    <text class="sn" x="270" y="660">Later messages are ignored.</text>
    <text class="sn" x="270" y="676">update() now returns SUCCESS</text>
    <text class="sn" x="270" y="692">on every tick.</text>
    <text class="c" x="270" y="718">CheckAbort: ABORT received</text>
  </g>
  <g>
    <rect class="step sv" x="492" y="550" width="214" height="200" rx="6"/>
    <text class="tag" x="506" y="572" fill="#15803d">3 · VERIFIED</text>
    <text class="sh" x="506" y="594">Ground is told</text>
    <text class="c" x="506" y="618">send_to_ground(node,</text>
    <text class="c" x="506" y="634">  "ENG: ABORT received")</text>
    <text class="sn" x="506" y="660">Sent once, from the same</text>
    <text class="sn" x="506" y="676">callback, so the operator</text>
    <text class="sn" x="506" y="692">sees the abort was accepted.</text>
  </g>
  <g>
    <rect class="step sp" x="728" y="550" width="214" height="200" rx="6"/>
    <text class="tag" x="742" y="572" fill="#b45309">4 · REACHED, WAITING</text>
    <text class="sh" x="742" y="594">AbortLand requests LAND</text>
    <text class="c" x="742" y="618">wait for mavros/state</text>
    <text class="c" x="742" y="634">call mavros/cmd/land</text>
    <text class="c" x="742" y="650">  (CommandTOL)</text>
    <text class="sn" x="742" y="676">If the call is rejected, Land</text>
    <text class="sn" x="742" y="692">fails and RetryLand sends it</text>
    <text class="sn" x="742" y="708">again. In the bench test it</text>
    <text class="sn" x="742" y="724">waited: no flight controller.</text>
  </g>
  <g>
    <rect class="step sp" x="964" y="550" width="216" height="200" rx="6"/>
    <text class="tag" x="978" y="572" fill="#b45309">5 · NEEDS FC OR SITL</text>
    <text class="sh" x="978" y="594">Flight controller lands</text>
    <text class="c" x="978" y="618">LAND mode, descend</text>
    <text class="c" x="978" y="634">mavros/state.armed=False</text>
    <text class="sn" x="978" y="660">AbortLand returns SUCCESS,</text>
    <text class="sn" x="978" y="676">Aborted holds the tree, and</text>
    <text class="sn" x="978" y="692">the ground gets:</text>
    <text class="c" x="978" y="718">ENG: landed and disarmed</text>
  </g>
  <path class="ar" d="M236 650H254" marker-end="url(#a)"/>
  <path class="ar" d="M472 650H490" marker-end="url(#a)"/>
  <path class="ar" d="M708 650H726" marker-end="url(#a)"/>
  <path class="ar" d="M944 650H962" marker-end="url(#a)"/>

  <!-- legend -->
  <g transform="translate(24 782)">
    <rect width="14" height="14" rx="3" fill="#dbeafe" stroke="#2563eb"/><text class="sn" x="20" y="12">RUNNING</text>
    <rect x="96" width="14" height="14" rx="3" fill="#dcfce7" stroke="#16a34a"/><text class="sn" x="116" y="12">SUCCESS</text>
    <rect x="192" width="14" height="14" rx="3" fill="#fee2e2" stroke="#dc2626"/><text class="sn" x="212" y="12">FAILURE / abort path</text>
    <rect x="356" width="14" height="14" rx="3" fill="#f3f4f6" stroke="#9ca3af" stroke-dasharray="3 2"/><text class="sn" x="376" y="12">Halted</text>
    <rect x="444" width="14" height="14" rx="3" fill="#fff" stroke="#d1d5db"/><text class="sn" x="464" y="12">Not ticked</text>
    <path d="M560 7H600" stroke="#16a34a" stroke-width="2"/><text class="sn" x="608" y="12">Verified in the bench test</text>
    <path d="M790 7H830" stroke="#d97706" stroke-width="2" stroke-dasharray="6 4"/><text class="sn" x="838" y="12">Implemented, needs a flight controller or SITL to verify</text>
  </g>
  <text class="sn" x="24" y="826">Source: airside/src/engine/engine/behaviors/safety_supervisor.py, subtrees/abort.py, behaviors/navigation/land.py and manager.py</text>
</svg>
